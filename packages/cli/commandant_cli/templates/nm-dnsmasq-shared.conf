# Commandant hub — extra config for the dnsmasq NetworkManager runs for the AP.
#
# With `ipv4.method shared`, NetworkManager hands out client addresses itself
# and reads this directory for anything beyond that. Installed to
# /etc/NetworkManager/dnsmasq-shared.d/commandant.conf by `commandant install`.
# The legacy (dhcpcd + hostapd) path carries the same lines in dnsmasq.conf.

# Local DNS convenience: resolve the bare hostname to the hub. (Browsers should
# use commandant.local via mDNS/avahi; this is a belt-and-suspenders fallback.)
address=/commandant/192.168.50.1
address=/commandant.local/192.168.50.1
