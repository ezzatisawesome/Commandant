# Commandant hub — standalone WiFi access point (hostapd).
#
# Makes the Raspberry Pi its own WiFi network so, in the field, a phone/laptop can
# join it directly with no infrastructure. Installed to /etc/hostapd/hostapd.conf
# by deploy/provision.sh.
#
# CHANGE BEFORE FIELD USE: wpa_passphrase (and optionally ssid), and set
# country_code to your actual regulatory domain — a wrong/missing country code can
# disable 5 GHz and some channels, or make the AP refuse to start.

# The Pi's built-in WiFi interface acting as the AP.
interface=wlan0
driver=nl80211

# Network name clients see when they scan.
ssid=commandant

# --- Radio -------------------------------------------------------------------
# hw_mode=g (2.4 GHz) is the most compatible for phones at range in the field.
# For 5 GHz use hw_mode=a and a valid channel for your country (and DFS care).
hw_mode=g
channel=7
# 2.4 GHz 802.11n (HT). Harmless if clients are older.
ieee80211n=1
wmm_enabled=1

# REQUIRED: set to your regulatory domain (US, CA, GB, DE, …). Placeholder:
country_code=US

# --- Security (WPA2-PSK) -----------------------------------------------------
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
# CHANGE ME — 8..63 chars. This is the WiFi password people type to join the hub.
wpa_passphrase=changeme-commandant

# Broadcast the SSID (0 = visible). Set 1 to hide (not real security).
ignore_broadcast_ssid=0
