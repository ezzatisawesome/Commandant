# Commandant hub — DHCP for AP clients (dnsmasq).
#
# Hands out IP addresses to phones/laptops that join the hub's WiFi, and points
# them at the Pi as gateway/DNS. Installed to /etc/dnsmasq.d/commandant.conf by
# deploy/provision.sh (kept separate so it doesn't clobber a stock dnsmasq.conf).
#
# The Pi gives itself 192.168.50.1 on wlan0 (see provision.sh / dhcpcd static IP).
# mDNS (commandant.local) is handled by avahi, not here — this is just addressing.

# Only serve DHCP on the AP interface; never on a wired/uplink interface.
interface=wlan0
bind-interfaces

# Address pool for clients, with a 12h lease. .1 is the Pi itself (reserved).
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,12h

# Advertise the Pi as gateway (option 3) and DNS (option 6).
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1

# Local DNS convenience: resolve the bare hostname to the Pi. (Browsers should use
# commandant.local via mDNS/avahi; this is a belt-and-suspenders fallback.)
address=/commandant/192.168.50.1
address=/commandant.local/192.168.50.1

# Don't forward queries for plain names with no domain, and don't read /etc/resolv
# upstream — the hub is standalone with no internet in the field.
domain-needed
bogus-priv
no-resolv
