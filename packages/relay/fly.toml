# Fly.io deployment for the relay. Chosen because it terminates TLS, holds long
# websockets without idle timeouts, and runs a single always-on machine cheaply.
#
#   fly launch --no-deploy --name commandant-relay
#   fly secrets set RELAY_TOKEN="$(openssl rand -hex 32)"
#   fly deploy
#   fly certs add commandant.guppi.com      # then add the CNAME it prints
#
# Any host that runs a container and does not kill idle websockets works the same
# way (Railway, Render, a VPS); only this file is Fly-specific.

app = "commandant-relay"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8791"

[http_service]
  internal_port = 8791
  force_https = true
  # One machine: viewers of a flight must all reach the one publisher, and the
  # relay keeps the current frame in memory. Scaling out needs a shared bus
  # first, which is not worth it until there are many simultaneous flights.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
